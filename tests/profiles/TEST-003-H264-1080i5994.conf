# ============================================================
# EJTV Broadcast Test Lab
# Profile TEST-003
# ============================================================

PROFILE_NAME="TEST-003"

DESCRIPTION="H.264 1080i59.94 AAC"

# ------------------------------------------------------------
# Video
# ------------------------------------------------------------

VIDEO_CODEC="libx264"

VIDEO_PROFILE="high"
VIDEO_LEVEL="4.1"

PRESET="ultrafast"
TUNE="zerolatency"

WIDTH=1920
HEIGHT=1080

# 29.97 fps progresivo de entrada
# posteriormente convertido a 1080i59.94
FPS="30000/1001"

PIX_FMT="yuv420p"

GOP_SIZE=30
KEYINT_MIN=30
SC_THRESHOLD=0

VIDEO_BITRATE="6000k"
VIDEO_MAXRATE="6000k"
VIDEO_BUFSIZE="12000k"

# ------------------------------------------------------------
# Video Filter
# ------------------------------------------------------------

# Convierte la señal progresiva generada por testsrc2
# a una señal entrelazada (Top Field First)

VIDEO_FILTER="tinterlace=interleave_top"

# ------------------------------------------------------------
# Audio
# ------------------------------------------------------------

AUDIO_CODEC="aac"

AUDIO_BITRATE="128k"

AUDIO_RATE=48000

AUDIO_CHANNELS=2

# ------------------------------------------------------------
# Output
# ------------------------------------------------------------

OUTPUT_PATH="live/test-003"

PROTOCOL="rtsp"