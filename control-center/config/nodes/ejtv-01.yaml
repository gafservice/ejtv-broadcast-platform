node: ejtv-01

network_interfaces:
  - interface: enp9s0
    role: INGEST
    expected_up: true
    critical: true

  - interface: ens2f0
    role: PUBLICATION
    expected_up: true
    critical: true

  - interface: ens2f1
    role: BACKUP
    expected_up: false
    critical: false

  - interface: enp10s0
    role: TEST
    expected_up: false
    critical: false

  - interface: lo
    role: LOOPBACK
    expected_up: true
    critical: false

session_policies:
  expected_sessions: []

  critical_paths:
    - path: ejtv
      enabled: true
      no_readers_grace_seconds: 15
      unavailable_grace_seconds: 15
      traffic_stalled_grace_seconds: 15

  reconnect_flapping:
    reconnect_timeout_seconds: 10
    window_seconds: 60
    threshold: 3

media_profiles:
  - profile_id: impact-main
    service_id: impact
    path_name: impact

    video:
      presence: required
      codec: h264
      profile: Main
      level: "40"
      width: 1920
      height: 1080
      frame_rate:
        numerator: 30
        denominator: 1

    audio:
      presence: required
      codec: aac
      profile: LC
      sample_rate: 48000
      channels: 2
      channel_layout: stereo


  - profile_id: ejtv-main
    service_id: ejtv
    path_name: ejtv

    video:
      presence: required
      codec: hevc
      profile: Main
      level: "120"
      width: 1920
      height: 1080
      frame_rate:
        numerator: 30000
        denominator: 1001

    audio:
      presence: required
      codec: aac
      profile: LC
      sample_rate: 48000
      channels: 2
      channel_layout: stereo

  - profile_id: enlace-main
    service_id: enlace
    path_name: enlace

    video:
      presence: required
      codec: hevc
      profile: Main
      level: "120"
      width: 1920
      height: 1080
      frame_rate:
        numerator: 30000
        denominator: 1001

    audio:
      presence: required
      codec: aac
      profile: LC
      sample_rate: 48000
      channels: 2
      channel_layout: stereo
