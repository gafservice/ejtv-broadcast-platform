node: ejtv-01

network_interfaces:
  - interface: enp9s0
    role: INGEST
    expected_up: true
    critical: true

  - interface: ens2f0
    role: PUBLICATION
    expected_up: true
    critical: true

  - interface: ens2f1
    role: BACKUP
    expected_up: false
    critical: false

  - interface: enp10s0
    role: TEST
    expected_up: false
    critical: false

  - interface: lo
    role: LOOPBACK
    expected_up: true
    critical: false

session_policies:
  expected_sessions:
    - policy_id: ejtv-publication
      protocol: SRT
      role: PUBLISHER
      path: ejtv
      enabled: true
      missing_grace_seconds: 15

  critical_paths:
    - path: ejtv
      enabled: true
      no_readers_grace_seconds: 15

  reconnect_flapping:
    reconnect_timeout_seconds: 10
    window_seconds: 60
    threshold: 3
